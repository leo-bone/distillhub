name: Deploy to Cloudflare Pages

# 这个项目的 Cloudflare Pages「Git 集成」是断的（Pages 侧 source = None，
# 最后一次自动部署停在 2026-04-12），所以推送到 GitHub 不会触发任何构建。
# 这里改用 GitHub Actions + wrangler 直传部署，恢复「push 即上线」。
#
# 需要在仓库 Settings → Secrets and variables → Actions 里配置两个 secret：
#   CLOUDFLARE_API_TOKEN    Cloudflare API Token（权限：Account > Cloudflare Pages > Edit）
#   CLOUDFLARE_ACCOUNT_ID   Cloudflare Account ID（仪表盘右侧栏可复制）
#
# 注意：wrangler v4 起不再支持 Global API Key（CLOUDFLARE_API_KEY + CLOUDFLARE_EMAIL），
# 必须用 API Token，否则会报 “In a non-interactive environment, it's necessary to set
# a CLOUDFLARE_API_TOKEN”。

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 检查 Cloudflare 凭据
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::缺少 CLOUDFLARE_API_TOKEN secret，请到 Settings → Secrets and variables → Actions 添加"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        run: npx -y wrangler@latest pages deploy dist --project-name distillhub --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
